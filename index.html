<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sound-toggle {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sound-toggle:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .sound-toggle.muted {
            background: #e74c3c;
        }

        .reset-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card.flipped {
            background: white;
            border: 3px solid #667eea;
        }

        .card.matched {
            background: #2ecc71;
            cursor: default;
            animation: matchAnimation 0.5s ease;
        }

        .card.matched:hover {
            transform: none;
        }

        .card-front {
            display: none;
        }

        .card.flipped .card-front,
        .card.matched .card-front {
            display: block;
        }

        .card-back {
            color: white;
            font-size: 0.8em;
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            display: none;
        }

        @keyframes matchAnimation {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
        }

        .game-over {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #2ecc71;
            color: white;
            border-radius: 10px;
            font-size: 1.5em;
            animation: slideDown 0.5s ease;
        }

        .game-over.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }

            .card {
                font-size: 2em;
            }

            h1 {
                font-size: 1.8em;
            }

            .game-info {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🍎 Fruit Memory Game 🍌</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span class="info-label">Moves</span>
                <span class="info-value" id="moves">0</span>
            </div>
            <div class="controls">
                <button class="sound-toggle" id="soundToggle">
                    <span id="soundIcon">🔊</span>
                    <span>Sound</span>
                </button>
                <button class="reset-btn" id="resetBtn">🔄 Reset</button>
            </div>
            <div class="info-item">
                <span class="info-label">Matches</span>
                <span class="info-value" id="matches">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="game-over" id="gameOver">
            🎉 Congratulations! You won in <span id="finalMoves">0</span> moves! 🎉
        </div>
    </div>

    <script>
        // Game state
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let soundEnabled = true;

        // Fruit symbols
        const fruits = ['🍎', '🍌', '🍇', '🍊', '🍓', '🍉', '🍑', '🥝'];

        // Audio context for sound effects (lazy initialization)
        let audioContext = null;

        // Initialize audio context on first use
        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // Sound effect functions
        function playFlipSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = 400;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.1);
        }

        function playMatchSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = 600;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.3);
            
            // Add a second tone for harmony
            setTimeout(() => {
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                
                osc2.frequency.value = 800;
                osc2.type = 'square';
                
                gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc2.start(ctx.currentTime);
                osc2.stop(ctx.currentTime + 0.3);
            }, 100);
        }

        function playMismatchSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            oscillator.frequency.value = 200;
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.2);
        }

        function playWinSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            const notes = [523.25, 587.33, 659.25, 783.99]; // C, D, E, G
            
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + 0.4);
                }, index * 100);
            });
        }

        // Initialize game
        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            
            updateScore();
            document.getElementById('gameOver').classList.remove('show');
            
            // Create pairs of cards
            const cardPairs = [...fruits, ...fruits];
            
            // Shuffle cards using Fisher-Yates algorithm
            for (let i = cardPairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardPairs[i], cardPairs[j]] = [cardPairs[j], cardPairs[i]];
            }
            
            // Create card elements
            cardPairs.forEach((fruit, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.fruit = fruit;
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="card-front">${fruit}</div>
                    <div class="card-back">❓</div>
                `;
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
                cards.push(card);
            });
        }

        // Flip card
        function flipCard(e) {
            const card = e.currentTarget;
            
            // Prevent flipping if conditions not met
            if (flippedCards.length >= 2 || 
                card.classList.contains('flipped') || 
                card.classList.contains('matched')) {
                return;
            }
            
            // Flip the card
            card.classList.add('flipped');
            flippedCards.push(card);
            playFlipSound();
            
            // Check for match
            if (flippedCards.length === 2) {
                moves++;
                updateScore();
                checkMatch();
            }
        }

        // Check if cards match
        function checkMatch() {
            const [card1, card2] = flippedCards;
            const fruit1 = card1.dataset.fruit;
            const fruit2 = card2.dataset.fruit;
            
            if (fruit1 === fruit2) {
                // Match found
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    playMatchSound();
                    flippedCards = [];
                    matchedPairs++;
                    updateScore();
                    
                    // Check if game is won
                    if (matchedPairs === fruits.length) {
                        setTimeout(() => {
                            document.getElementById('finalMoves').textContent = moves;
                            document.getElementById('gameOver').classList.add('show');
                            playWinSound();
                        }, 500);
                    }
                }, 500);
            } else {
                // No match
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    playMismatchSound();
                    flippedCards = [];
                }, 1000);
            }
        }

        // Update score display
        function updateScore() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matchedPairs;
        }

        // Toggle sound
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundToggle = document.getElementById('soundToggle');
            const soundIcon = document.getElementById('soundIcon');
            
            if (soundEnabled) {
                soundToggle.classList.remove('muted');
                soundIcon.textContent = '🔊';
            } else {
                soundToggle.classList.add('muted');
                soundIcon.textContent = '🔇';
            }
        }

        // Event listeners
        document.getElementById('soundToggle').addEventListener('click', toggleSound);
        document.getElementById('resetBtn').addEventListener('click', initGame);

        // Start the game
        initGame();
    </script>
</body>
</html>
